<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        :root {
            --bg-color: #1a1a1a;
            --surface-color: #242424;
            --text-primary: #eeeeee;
            --text-secondary: #b0b0b0;
            --accent-color: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 2rem;
        }

        main {
            width: 100%;
            max-width: 1000px;
        }

        .container {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        /* Featured Videos */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            align-items: start;
        }

        .video-card-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .project-card {
            background-color: var(--surface-color);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
            width: 100%;
        }

        .project-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
            transition: all 0.5s ease;
        }

        .video-card-link:hover .project-card {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        .video-card-link:hover .project-card img {
            transform: scale(1.05);
            filter: brightness(0.6);
        }

        .project-card .play-icon {
            z-index: 10;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-card-link:hover .play-icon {
            color: #ff0000;
            transform: scale(1.15);
            filter: drop-shadow(0 6px 12px rgba(255,0,0,0.4));
        }

        .video-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            transition: color 0.3s;
            line-height: 1.4;
        }

        .video-card-link:hover .video-title {
            color: var(--accent-color);
        }

        /* Database Table */
        .controls-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            flex-grow: 1;
            min-width: 200px;
            transition: border-color 0.2s;
        }

        .search-input:focus, .filter-select:focus {
            border-color: var(--accent-color);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        th:hover {
            color: var(--text-primary);
        }
        
        th.sort-asc::after {
            content: ' \25B2';
            font-size: 0.8em;
        }
        
        th.sort-desc::after {
            content: ' \25BC';
            font-size: 0.8em;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .link-btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: rgba(22, 163, 74, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(22, 163, 74, 0.2);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .link-btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .no-link {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-style: italic;
            padding: 0.5rem 1rem;
        }

        .type-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .type-film { background-color: rgba(249, 115, 22, 0.1); color: #f97316; border: 1px solid rgba(249, 115, 22, 0.2); }
        .type-short-film { background-color: rgba(234, 179, 8, 0.1); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.2); }
        .type-video { background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .type-short-video { background-color: rgba(168, 85, 247, 0.1); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.2); }

        @media (max-width: 768px) {
            body {
                padding: 2rem 1rem;
            }
            .container {
                padding: 1.5rem;
            }
            /* Hide the Watch column header and cells */
            table thead th:last-child,
            table tbody td:last-child {
                display: none;
            }
            /* Make entire rows clickable and give visual feedback */
            table tbody tr {
                cursor: pointer;
            }
            table tbody tr:active {
                background-color: rgba(255, 255, 255, 0.05);
            }
        }
    </style>
</head>
<body>
    <main>
        <!-- Featured Videos -->
        <div class="container">
            <h2>Featured</h2>
            <div class="video-grid" id="featuredGrid">
                <!-- Featured videos will be populated dynamically -->
            </div>
        </div>

        <!-- Videos Database -->
        <div class="container">
            <h2>All Movies and Videos</h2>
            
            <div class="controls-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by title...">
                <select id="typeFilter" class="filter-select">
                    <option value="">All Types</option>
                    <option value="Film">Film</option>
                    <option value="Short Film">Short Film</option>
                    <option value="Short Video">Short Video</option>
                    <option value="Video">Video</option>
                </select>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th onclick="handleSort('name')" data-col="name">Title</th>
                            <th onclick="handleSort('type')" data-col="type">Type</th>
                            <th onclick="handleSort('year')" data-col="year">Year</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Table rows will be populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let videosData = [];
        let currentSortCol = 'year'; // Default sort by year
        let currentSortAsc = false; // Default descending (newest first)

        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');

        async function loadData() {
            try {
                const response = await fetch('videos.csv');
                const csvText = await response.text();
                parseCSV(csvText);
                renderFeatured();
                renderTable();
            } catch (error) {
                console.error("Error loading videos.csv:", error);
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            videosData = [];
            
            if (lines.length < 2) return;

            // Auto-detect column indices based on header
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[^a-z]/g, ''));
            const nameIdx = headers.indexOf('name') !== -1 ? headers.indexOf('name') : 0;
            const yearIdx = headers.indexOf('year') !== -1 ? headers.indexOf('year') : 1;
            const linkIdx = headers.indexOf('link') !== -1 ? headers.indexOf('link') : 2;
            const typeIdx = headers.indexOf('type') !== -1 ? headers.indexOf('type') : 4;
            const featuredIdx = headers.indexOf('featured') !== -1 ? headers.indexOf('featured') : 5;
            const thumbIdx = headers.indexOf('thumbnail') !== -1 ? headers.indexOf('thumbnail') : 6;
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                let inQuotes = false;
                let currentWord = '';
                let row = [];
                for(let char of line) {
                    if(char === '"') {
                        inQuotes = !inQuotes;
                    } else if(char === ',' && !inQuotes) {
                        row.push(currentWord);
                        currentWord = '';
                    } else {
                        currentWord += char;
                    }
                }
                row.push(currentWord);
                
                videosData.push({
                    name: row[nameIdx] ? row[nameIdx].trim() : '',
                    year: row[yearIdx] ? parseInt(row[yearIdx].trim()) : 0,
                    link: row[linkIdx] ? row[linkIdx].trim() : '',
                    type: row[typeIdx] ? row[typeIdx].trim() : '',
                    featured: row[featuredIdx] ? row[featuredIdx].trim().toLowerCase() === 'yes' : false,
                    thumbnail: row[thumbIdx] ? row[thumbIdx].trim() : ''
                });
            }
        }

        function getYouTubeEmbedUrl(url) {
            if (!url) return null;
            // Robust YouTube URL regex extraction
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([^"&?\/\s]{11})/);
            return match ? `https://www.youtube-nocookie.com/embed/${match[1]}` : null;
        }

        function renderFeatured() {
            const featuredGrid = document.getElementById('featuredGrid');
            featuredGrid.innerHTML = '';
            
            const featuredVideos = videosData
                .filter(v => v.featured && v.link)
                .sort((a, b) => b.year - a.year);
                
            if (featuredVideos.length === 0) {
                featuredGrid.innerHTML = '<p style="color: var(--text-secondary);">No featured videos found or URLs are invalid.</p>';
                return;
            }
                
            featuredVideos.forEach(video => {
                const isShort = video.type.toLowerCase().includes('short');
                const aspectRatio = isShort ? '9 / 16' : '16 / 9';

                const container = document.createElement('a');
                container.href = video.link;
                container.target = "_blank";
                container.className = "video-card-link";
                
                const card = document.createElement('div');
                card.className = "project-card";
                card.style.aspectRatio = aspectRatio;
                
                if (video.thumbnail) {
                    const img = document.createElement('img');
                    img.src = video.thumbnail;
                    img.alt = video.name;
                    card.appendChild(img);
                }
                
                const playIcon = document.createElement('div');
                playIcon.className = "play-icon";
                playIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24"><path fill="currentColor" d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon fill="white" points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>`;
                card.appendChild(playIcon);
                
                container.appendChild(card);

                const title = document.createElement('div');
                title.className = "video-title";
                title.textContent = video.name;
                container.appendChild(title);
                
                featuredGrid.appendChild(container);
            });
        }

        function getTypeClass(type) {
            switch(type.toLowerCase()) {
                case 'film': return 'type-film';
                case 'short film': return 'type-short-film';
                case 'short video': return 'type-short-video';
                case 'video': return 'type-video';
                default: return '';
            }
        }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const filterType = typeFilter.value;

            // Filter data
            let filteredData = videosData.filter(video => {
                const matchesSearch = video.name.toLowerCase().includes(searchTerm);
                const matchesType = filterType === "" || video.type === filterType;
                return matchesSearch && matchesType;
            });

            // Sort data
            filteredData.sort((a, b) => {
                let valA = a[currentSortCol];
                let valB = b[currentSortCol];

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return currentSortAsc ? -1 : 1;
                if (valA > valB) return currentSortAsc ? 1 : -1;
                return 0;
            });

            // Update DOM
            tableBody.innerHTML = '';
            
            if (filteredData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No videos found matching your criteria.</td></tr>';
                return;
            }

            filteredData.forEach(video => {
                const tr = document.createElement('tr');

                // Make entire row clickable on mobile (and desktop for convenience)
                if (video.link) {
                    tr.addEventListener('click', (e) => {
                        if (e.target.closest('a')) return;
                        window.open(video.link, '_blank');
                    });
                }
                
                // Name
                const tdName = document.createElement('td');
                tdName.textContent = video.name;
                tdName.style.fontWeight = "500";
                
                // Type
                const tdType = document.createElement('td');
                const typeBadge = document.createElement('span');
                typeBadge.textContent = video.type;
                typeBadge.className = `type-badge ${getTypeClass(video.type)}`;
                tdType.appendChild(typeBadge);
                
                // Year
                const tdYear = document.createElement('td');
                tdYear.textContent = video.year;
                
                // Link
                const tdLink = document.createElement('td');
                if (video.link) {
                    const a = document.createElement('a');
                    a.href = video.link;
                    a.target = "_blank";
                    a.className = "link-btn";
                    a.textContent = "Watch";
                    tdLink.appendChild(a);
                } else {
                    const span = document.createElement('span');
                    span.className = "no-link";
                    span.textContent = "Not available";
                    tdLink.appendChild(span);
                }

                tr.appendChild(tdName);
                tr.appendChild(tdType);
                tr.appendChild(tdYear);
                tr.appendChild(tdLink);
                
                tableBody.appendChild(tr);
            });

            // Update Sort Indicators
            document.querySelectorAll('th[data-col]').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.getAttribute('data-col') === currentSortCol) {
                    th.classList.add(currentSortAsc ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        // Global function for onclick
        window.handleSort = function(col) {
            if (currentSortCol === col) {
                currentSortAsc = !currentSortAsc; // Toggle direction
            } else {
                currentSortCol = col;
                currentSortAsc = true; // Default to asc for new column
                if(col === 'year') currentSortAsc = false; // Default to desc for year
            }
            renderTable();
        };

        // Event Listeners
        searchInput.addEventListener('input', renderTable);
        typeFilter.addEventListener('change', renderTable);

        // Initial Render
        loadData();
    </script>
</body>
</html>
